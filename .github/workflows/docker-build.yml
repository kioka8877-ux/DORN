name: Build Docker Image — DORN F03

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "F03_SIGISMUND/CODEBASE/Dockerfile"
      - "F03_SIGISMUND/CODEBASE/package.json"
      - "F03_SIGISMUND/CODEBASE/package-lock.json"

jobs:
  build-and-push:
    name: Build & Push ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: F03_SIGISMUND/CODEBASE
          file: F03_SIGISMUND/CODEBASE/Dockerfile
          push: true
          tags: |
            ghcr.io/kioka8877-ux/dorn-remotion:latest
            ghcr.io/kioka8877-ux/dorn-remotion:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
